<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script><script src="anim.js"></script>
<script>
// Open in a browser for a live preview (?t=12 to jump).
if (!navigator.webdriver) window.ready.then(() => {
  const t0 = performance.now() - (+new URLSearchParams(location.search).get('t') || 0) * 1000;
  const loop = () => { renderFrame(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); };
  loop();
});
</script></body></html>
